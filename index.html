<script>
(() => {
  const canvas = document.getElementById("mouse-trail");
  const ctx = canvas.getContext("2d");

  let w, h, dpr;
  const points = [];
  const isTouch = matchMedia("(pointer: coarse)").matches;

  if (isTouch) {
    canvas.remove();
    return;
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  window.addEventListener("resize", resize);
  window.addEventListener("pointermove", e => {
    points.push({
      x: e.clientX,
      y: e.clientY,
      life: 1
    });
    if (points.length > 24) points.shift();
  });

  function draw() {
    ctx.clearRect(0, 0, w, h);

    for (const p of points) p.life -= 0.035;

    while (points.length && points[0].life <= 0) {
      points.shift();
    }

    for (let i = 1; i < points.length; i++) {
      const a = points[i - 1];
      const b = points[i];
      const alpha = Math.min(a.life, b.life);
      const progress = i / points.length;

      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = `rgba(229, 9, 43, ${alpha * progress})`;
      ctx.lineWidth = 1 + progress * 3;
      ctx.lineCap = "round";
      ctx.shadowBlur = 10;
      ctx.shadowColor = "#e5092b";
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(b.x, b.y, 1.2 + progress, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 255, 255, ${alpha * progress})`;
      ctx.fill();
    }

    ctx.shadowBlur = 0;
    requestAnimationFrame(draw);
  }

  resize();
  draw();
})();
</script>

<script>
(() => {
  const canvas = document.getElementById("particles");
  const ctx = canvas.getContext("2d");

  let width, height, dpr, particles = [];
  let animationId;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const count = Math.min(
      75,
      Math.max(30, Math.floor(width * height / 16000))
    );

    particles = Array.from({ length: count }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      r: Math.random() * 1.7 + .5,
      vx: (Math.random() - .5) * .3,
      vy: (Math.random() - .5) * .3,
      alpha: Math.random() * .65 + .2,
      color: Math.random() > .35 ? "229,9,43" : "255,255,255"
    }));
  }

  function draw() {
    ctx.clearRect(0, 0, width, height);

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];

      p.x += p.vx;
      p.y += p.vy;

      if (p.x < 0 || p.x > width) p.vx *= -1;
      if (p.y < 0 || p.y > height) p.vy *= -1;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${p.color},${p.alpha})`;
      ctx.shadowBlur = 9;
      ctx.shadowColor = `rgba(${p.color},.65)`;
      ctx.fill();

      for (let j = i + 1; j < particles.length; j++) {
        const q = particles[j];
        const dx = p.x - q.x;
        const dy = p.y - q.y;
        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < 105) {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(q.x, q.y);
          ctx.strokeStyle =
            `rgba(229,9,43,${(1 - distance / 105) * .15})`;
          ctx.lineWidth = .7;
          ctx.stroke();
        }
      }
    }

    ctx.shadowBlur = 0;
    animationId = requestAnimationFrame(draw);
  }

  window.addEventListener("resize", resize);
  resize();
  draw();
})();
</script>
