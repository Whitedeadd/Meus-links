
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080203">
<title>WHITE — Links</title>

<style>
:root {
  --bg: #080203;
  --red: #e5092b;
  --red-dark: #650817;
  --white: #f5eeee;
  --muted: #a58f94;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--white);
  font-family: Inter, system-ui, sans-serif;
}

body {
  overflow-x: hidden;
}

#particles {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

.background-glow {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
  background:
    radial-gradient(
      ellipse at 50% 48%,
      rgba(91, 0, 17, .28) 0%,
      transparent 48%
    ),
    radial-gradient(
      ellipse at 50% 0%,
      rgba(75, 0, 15, .34),
      transparent 65%
    ),
    linear-gradient(180deg, #100306, #070203 80%);
}

.glow {
  position: absolute;
  width: 380px;
  height: 380px;
  border-radius: 50%;
  filter: blur(115px);
  opacity: .16;
  animation: float 14s ease-in-out infinite alternate;
}

.glow.one {
  background: #ff002b;
  top: -210px;
  left: -170px;
}

.glow.two {
  background: #a00020;
  right: -180px;
  bottom: -190px;
  animation-delay: -5s;
}

@keyframes float {
  from {
    transform: translate(0, 0) scale(1);
  }

  to {
    transform: translate(70px, 55px) scale(1.22);
  }
}

main {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 45px 20px;
}

.profile {
  width: min(100%, 380px);
  text-align: center;
  animation: appear .85s ease both;
}

.avatar {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  margin: 0 auto 20px;
  overflow: hidden;
  border: 2px solid #b80b28;
  box-shadow:
    0 0 12px rgba(229, 9, 43, .7),
    0 0 34px rgba(229, 9, 43, .42);
  animation:
    avatarIn .95s cubic-bezier(.2, .8, .2, 1) both,
    avatarGlow 2.8s ease-in-out 1s infinite alternate;
}

.avatar img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

@keyframes avatarIn {
  from {
    opacity: 0;
    transform: translateY(12px) scale(.84);
    filter: blur(5px);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: blur(0);
  }
}

@keyframes avatarGlow {
  from {
    box-shadow:
      0 0 9px rgba(229, 9, 43, .45),
      0 0 22px rgba(229, 9, 43, .18);
  }

  to {
    box-shadow:
      0 0 14px rgba(229, 9, 43, .8),
      0 0 38px rgba(229, 9, 43, .42);
  }
}

h1 {
  margin: 0;
  font-size: clamp(24px, 5vw, 30px);
  letter-spacing: .22em;
  padding-left: .22em;
  font-weight: 800;
  text-shadow: 0 0 12px rgba(255, 255, 255, .12);
  animation: appear .7s ease .16s both;
}

.tagline {
  margin: 9px 0 38px;
  color: #a68b91;
  font-size: 9px;
  letter-spacing: .3em;
  text-transform: uppercase;
  animation: appear .7s ease .25s both;
}

.links {
  display: grid;
  gap: 12px;
}

.link {
  position: relative;
  display: flex;
  align-items: center;
  gap: 13px;
  width: 100%;
  min-height: 66px;
  padding: 12px 16px;
  border: 1px solid rgba(229, 9, 43, .25);
  border-radius: 14px;
  background: linear-gradient(
    110deg,
    rgba(36, 5, 12, .88),
    rgba(13, 5, 7, .92)
  );
  color: #e9dfe1;
  text-decoration: none;
  text-align: left;
  overflow: hidden;
  transition:
    transform .22s ease,
    border-color .22s ease,
    background .22s ease,
    box-shadow .22s ease;
  box-shadow: 0 3px 12px rgba(0, 0, 0, .16);
  animation: appear .65s ease both;
}

.link::before {
  content: "";
  position: absolute;
  top: 0;
  left: -120%;
  width: 80%;
  height: 100%;
  background: linear-gradient(
    110deg,
    transparent,
    rgba(255, 255, 255, .04),
    rgba(229, 9, 43, .09),
    transparent
  );
  transform: skewX(-20deg);
  transition: left .6s ease;
  pointer-events: none;
}

.link:hover::before {
  left: 140%;
}

.link:hover {
  transform: translateY(-2px);
  border-color: rgba(229, 9, 43, .72);
  background: linear-gradient(
    110deg,
    rgba(58, 5, 16, .94),
    rgba(18, 5, 8, .96)
  );
  box-shadow: 0 0 18px rgba(229, 9, 43, .13);
}

.icon {
  width: 38px;
  height: 38px;
  flex: 0 0 38px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(229, 9, 43, .28);
  border-radius: 11px;
  background: rgba(229, 9, 43, .07);
  color: #e5092b;
  transition: .25s ease;
}

.icon svg {
  width: 19px;
  height: 19px;
  display: block;
  fill: currentColor;
}

.link:hover .icon {
  border-color: rgba(229, 9, 43, .55);
  background: rgba(229, 9, 43, .14);
  box-shadow: 0 0 15px rgba(229, 9, 43, .12);
}

.label {
  font-size: 14px;
  font-weight: 650;
  line-height: 1.3;
}

.sub {
  display: block;
  margin-top: 4px;
  font-size: 11px;
  color: #80535c;
  font-weight: 400;
}

.arrow {
  margin-left: auto;
  color: #76202f;
  font-size: 22px;
  line-height: 1;
  transition: transform .22s ease, color .22s ease;
}

.link:hover .arrow {
  transform: translateX(3px);
  color: #f0a0ad;
}

.link:nth-child(1) {
  animation-delay: .32s;
}

.link:nth-child(2) {
  animation-delay: .42s;
}

.link:nth-child(3) {
  animation-delay: .52s;
}

.link:nth-child(4) {
  animation-delay: .62s;
}

.link:nth-child(5) {
  animation-delay: .72s;
}

footer {
  margin-top: 35px;
  color: #65474d;
  font-size: 9px;
  letter-spacing: .35em;
  animation: appear .7s ease .95s both;
}

footer span {
  color: #e5092b;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(10px);
    filter: blur(3px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
    filter: blur(0);
  }
}

@media (max-width: 480px) {
  main {
    padding: 30px 22px;
  }

  .profile {
    width: min(100%, 380px);
  }

  .avatar {
    width: 90px;
    height: 90px;
  }

  .tagline {
    margin-bottom: 30px;
    font-size: 8px;
  }

  .link {
    min-height: 62px;
    padding: 10px 12px;
  }

  .icon {
    width: 36px;
    height: 36px;
    flex-basis: 36px;
  }

  .label {
    font-size: 13px;
  }

  .sub {
    font-size: 10px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>

<script>
(() => {
  const canvas = document.getElementById("mouse-trail");
  const ctx = canvas.getContext("2d");

  let w, h, dpr;
  const points = [];
  const isTouch = matchMedia("(pointer: coarse)").matches;

  if (isTouch) {
    canvas.remove();
    return;
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;

    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  window.addEventListener("resize", resize);

  window.addEventListener("pointermove", e => {
    points.push({
      x: e.clientX,
      y: e.clientY,
      life: 1
    });

    if (points.length > 24) points.shift();
  });

  function draw() {
    ctx.clearRect(0, 0, w, h);

    for (const p of points) {
      p.life -= .035;
    }

    while (points.length && points[0].life <= 0) {
      points.shift();
    }

    for (let i = 1; i < points.length; i++) {
      const a = points[i - 1];
      const b = points[i];
      const alpha = Math.min(a.life, b.life);
      const progress = i / points.length;

      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = `rgba(229, 9, 43, ${alpha * progress})`;
      ctx.lineWidth = 1 + progress * 3;
      ctx.lineCap = "round";
      ctx.shadowBlur = 10;
      ctx.shadowColor = "#e5092b";
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(b.x, b.y, 1.2 + progress, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 255, 255, ${alpha * progress})`;
      ctx.fill();
    }

    ctx.shadowBlur = 0;
    requestAnimationFrame(draw);
  }

  resize();
  draw();
})();
</script>

<script>
(() => {
  const canvas = document.getElementById("particles");
  const ctx = canvas.getContext("2d");

  let width, height, dpr;
  let particles = [];

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const count = Math.min(
      75,
      Math.max(30, Math.floor(width * height / 16000))
    );

    particles = Array.from({ length: count }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      r: Math.random() * 1.7 + .5,
      vx: (Math.random() - .5) * .3,
      vy: (Math.random() - .5) * .3,
      alpha: Math.random() * .65 + .2,
      color: Math.random() > .35
        ? "229,9,43"
        : "255,255,255"
    }));
  }

  function draw() {
    ctx.clearRect(0, 0, width, height);

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];

      p.x += p.vx;
      p.y += p.vy;

      if (p.x < 0 || p.x > width) p.vx *= -1;
      if (p.y < 0 || p.y > height) p.vy *= -1;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${p.color},${p.alpha})`;
      ctx.shadowBlur = 9;
      ctx.shadowColor = `rgba(${p.color},.65)`;
      ctx.fill();

      for (let j = i + 1; j < particles.length; j++) {
        const q = particles[j];
        const dx = p.x - q.x;
        const dy = p.y - q.y;
        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < 105) {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(q.x, q.y);
          ctx.strokeStyle =
            `rgba(229,9,43,${(1 - distance / 105) * .15})`;
          ctx.lineWidth = .7;
          ctx.stroke();
        }
      }
    }

    ctx.shadowBlur = 0;
    requestAnimationFrame(draw);
  }

  window.addEventListener("resize", resize);
  resize();
  draw();
})();
</script>
