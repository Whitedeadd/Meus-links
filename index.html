<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080305">
<title>WHITE — Links</title>
<style>
:root{--bg:#080305;--panel:rgba(24,5,10,.88);--red:#a51f35;--red2:#5b101e;--text:#f5eef0;--muted:#bd8790}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
body{overflow-x:hidden}
#particles{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
body:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 30%,rgba(95,8,25,.25),transparent 58%),linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.45))}
main{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:42px 18px}
.profile{width:min(100%,430px);text-align:center;animation:appear .8s ease both}
.avatar{width:112px;height:112px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;overflow:hidden;border:2px solid #a51f35;box-shadow:0 0 0 6px rgba(165,31,53,.10),0 0 32px rgba(165,31,53,.22);background:linear-gradient(135deg,#3b0914,#100408);font-size:42px;font-weight:800;letter-spacing:-3px}
.avatar img{width:100%;height:100%;object-fit:cover;display:none}
h1{margin:0;font-size:clamp(28px,7vw,38px);letter-spacing:.22em;padding-left:.22em;font-weight:800}
.tagline{margin:9px 0 28px;color:var(--muted);font-size:11px;letter-spacing:.36em;text-transform:uppercase}
.links{display:grid;gap:12px}
.link{position:relative;display:flex;align-items:center;gap:14px;width:100%;padding:15px 17px;border:1px solid rgba(165,31,53,.65);border-radius:13px;background:linear-gradient(110deg,rgba(34,7,14,.96),rgba(17,4,8,.92));color:var(--text);text-decoration:none;text-align:left;transition:transform .2s,border-color .2s,box-shadow .2s,background .2s;box-shadow:0 7px 24px rgba(0,0,0,.16)}
.link:hover{transform:translateY(-3px);border-color:#e04760;box-shadow:0 9px 28px rgba(165,31,53,.17);background:linear-gradient(110deg,rgba(52,8,20,.98),rgba(20,4,9,.96))}
.icon{width:39px;height:39px;flex:0 0 39px;border-radius:10px;display:grid;place-items:center;border:1px solid rgba(165,31,53,.38);background:rgba(165,31,53,.12);color:#e05a6e;font-weight:800;font-size:17px}
.label{font-size:15px;font-weight:700;line-height:1.3}
.sub{display:block;margin-top:4px;font-size:12px;color:#bd8790;font-weight:400}
.arrow{margin-left:auto;color:#9f3a4c;font-size:22px}
footer{margin-top:28px;color:#77404a;font-size:10px;letter-spacing:.3em}
.note{margin-top:18px;color:#6e4b51;font-size:11px}
@keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="particles" aria-hidden="true"></canvas>
<main>
<section class="profile" aria-label="Links de WHITE">
  <div class="avatar" id="avatar"><span id="avatarFallback">W</span><img id="avatarImg" src="IMG_9591.jpg" alt="Foto de perfil"></div>
  <h1 id="name">WHITE</h1>
  <p class="tagline" id="tagline">MEUS LINKS · MINHAS REDES</p>
  <nav class="links" id="links">
    <a class="link" href="https://livepix.gg/whitedeadd" target="_blank" rel="noopener noreferrer"><span class="icon">✦</span><span class="label">LivePix<span class="sub">Envie um incentivo</span></span><span class="arrow">›</span></a>
    <a class="link" href="https://www.youtube.com/@White_deaddd" target="_blank" rel="noopener noreferrer"><span class="icon">▶</span><span class="label">YouTube<span class="sub">Vídeos e lives</span></span><span class="arrow">›</span></a>
    <a class="link" href="https://discord.gg/GMtqUPGmSd" target="_blank" rel="noopener noreferrer"><span class="icon">◈</span><span class="label">Discord<span class="sub">Entre na comunidade</span></span><span class="arrow">›</span></a>
    <a class="link" href="https://www.instagram.com/white_ddead/" target="_blank" rel="noopener noreferrer"><span class="icon">◎</span><span class="label">Instagram<span class="sub">Me acompanhe</span></span><span class="arrow">›</span></a>
    <a class="link" href="https://www.tiktok.com/@white_deadddd" target="_blank" rel="noopener noreferrer"><span class="icon">♪</span><span class="label">TikTok<span class="sub">Clipes e novidades</span></span><span class="arrow">›</span></a>
  </nav>
  <footer>WHITE · LINKS</footer>
  <p class="note">Edite os links para colocar seus perfis verdadeiros.</p>
</section>
</main>
<script>
(() => {
 const canvas=document.getElementById('particles'),ctx=canvas.getContext('2d');
 let w,h,dpr,particles=[];
 function resize(){
   dpr=Math.min(window.devicePixelRatio||1,2);w=innerWidth;h=innerHeight;
   canvas.width=w*dpr;canvas.height=h*dpr;canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);
   const count=Math.min(95,Math.max(35,Math.floor(w*h/14500)));
   particles=Array.from({length:count},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.8+.35,vx:(Math.random()-.5)*.22,vy:-Math.random()*.38-.06,a:Math.random()*.55+.12,p:Math.random()*Math.PI*2}));
 }
 function draw(){
   ctx.clearRect(0,0,w,h);
   for(const p of particles){
     p.x+=p.vx+Math.sin(p.p)*.08;p.y+=p.vy;p.p+=.012;
     if(p.y<-5){p.y=h+5;p.x=Math.random()*w}if(p.x<-5)p.x=w+5;if(p.x>w+5)p.x=-5;
     ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(222,42,70,${p.a})`;ctx.shadowBlur=10;ctx.shadowColor='rgba(190,20,48,.5)';ctx.fill();
   }
   ctx.shadowBlur=0;requestAnimationFrame(draw);
 }
 addEventListener('resize',resize);resize();draw();
})();
</script>
</body>
</html>
